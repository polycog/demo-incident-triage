[project]
name = "injury-triage"
version = "0.1.0"
description = "CLI assistant for a K-12 student injury triage policy, built on polycog-cognition"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "polycog-cognition==1.0.2",
    "pydantic-ai-slim[openai]~=2.56.0",
    "rich>=13",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
